<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouncing Ball</title>
  <link rel="stylesheet" href="bouncing.css" />
</head>
<body>
  <main class="wrap">
    <h1>Bouncing Ball</h1>

  </main>

  <script src="bouncing.js"></script>
</body>
</html>
